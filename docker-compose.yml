services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - backend
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - backend
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client for initial bucket creation
  minio-client:
    image: minio/mc:latest
    container_name: minio-client
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/user-profiles --ignore-existing;
      /usr/bin/mc mb myminio/user-documents --ignore-existing;
      /usr/bin/mc mb myminio/interview-audio --ignore-existing;
      /usr/bin/mc mb myminio/interview-recordings --ignore-existing;
      /usr/bin/mc mb myminio/system-backups --ignore-existing;
      /usr/bin/mc mb myminio/temporary-files --ignore-existing;
      /usr/bin/mc anonymous set download myminio/user-profiles;
      echo 'MinIO buckets created successfully';
      exit 0;
      "

  auth_service:
    build:
      context: ./auth_service
    container_name: auth_service
    volumes:
      - ./auth_service:/app
      - ./common:/app/common
    command: >
      sh -c "mkdir -p /app/logs &&
              python manage.py makemigrations &&
              python manage.py migrate &&
              python manage.py runserver 0.0.0.0:8000"
    # command: >
    #   sh -c "until pg_isready -h $DB_HOST -p $DB_PORT; do
    #           echo 'Waiting for DB...';
    #           sleep 2;
    #         done &&
    #         python manage.py migrate &&
    #         python manage.py runserver 0.0.0.0:8000"
    expose:
      - 8000
    env_file:
      - ./auth_service/.env
    depends_on:
      auth_db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend
      - signoz-net

  interview_service:
    build:
      context: ./interview_service
    container_name: interview_service
    volumes:
      - ./interview_service:/app
      - ./common:/app/common
    command: >
      sh -c "mkdir -p /app/logs &&
              python manage.py makemigrations --noinput &&
              python manage.py migrate &&
              python manage.py runserver 0.0.0.0:8001"
    # command: >
    #   sh -c "until pg_isready -h $DB_HOST -p $DB_PORT; do
    #           echo 'Waiting for DB...';
    #           sleep 2;
    #         done &&
    #         python manage.py migrate &&
    #         python manage.py runserver 0.0.0.0:8001"
    expose:
      - 8001
    env_file:
      - ./interview_service/.env
    depends_on:
      interview_db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend
      - signoz-net

  bloom_filter_service:
    build:
      context: ./bloom_filter_service
    container_name: bloom_filter_service
    volumes:
      - ./bloom_filter_service:/app
      - ./common:/app/common
    command: >
      sh -c "mkdir -p /app/logs &&
              python manage.py makemigrations &&
              python manage.py migrate &&
              python manage.py runserver 0.0.0.0:8002"
    expose:
      - 8002
    env_file:
      - ./bloom_filter_service/.env
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend
      - signoz-net

  auth_celery_worker:
    build:
      context: ./auth_service
    container_name: auth_celery_worker
    volumes:
      - ./auth_service:/app
      - ./common:/app/common
    command: celery -A auth_service worker --loglevel=info --queues=auth_queue
    env_file:
      - ./auth_service/.env
    environment:
      - IS_CELERY_WORKER=true
    depends_on:
      auth_db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - backend
      - signoz-net

  interview_celery_worker:
    build:
      context: ./interview_service
    container_name: interview_celery_worker
    volumes:
      - ./interview_service:/app
      - ./common:/app/common
    command: celery -A interview_service worker --loglevel=info --queues=interview_queue
    env_file:
      - ./interview_service/.env
    environment:
      - IS_CELERY_WORKER=true
    depends_on:
      interview_db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - backend
      - signoz-net

  bloom_filter_celery_worker:
    build:
      context: ./bloom_filter_service
    container_name: bloom_filter_celery_worker
    volumes:
      - ./bloom_filter_service:/app
      - ./common:/app/common
    command: celery -A bloom_filter_service worker --loglevel=info --queues=bloom_filter_queue
    env_file:
      - ./bloom_filter_service/.env
    environment:
      - IS_CELERY_WORKER=true
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend
      - signoz-net

  celery_beat:
    build:
      context: ./bloom_filter_service
    container_name: celery_beat
    volumes:
      - ./bloom_filter_service:/app
      - ./common:/app/common
      - celery_beat_data:/app/beat_data # Persist beat schedule directory
    working_dir: /app
    command: >
      sh -c "mkdir -p /app/beat_data &&
             celery -A bloom_filter_service beat --loglevel=info --schedule=/app/beat_data/celerybeat-schedule"
    environment:
      - PYTHONPATH=/app
    env_file:
      - ./bloom_filter_service/.env
    depends_on:
      - redis
    networks:
      - backend

  celery_flower:
    build:
      context: ./bloom_filter_service
    container_name: celery_flower
    volumes:
      - ./bloom_filter_service:/app
      - ./common:/app/common
    working_dir: /app
    command: celery -A bloom_filter_service flower --port=5555 --broker_api=http://guest:guest@redis:6379//
    ports:
      - "5555:5555"
    environment:
      - PYTHONPATH=/app
      - FLOWER_BASIC_AUTH=admin:admin
    env_file:
      - ./bloom_filter_service/.env
    depends_on:
      - redis
    networks:
      - backend
      - signoz-net

  auth_kafka_consumer:
    build:
      context: ./auth_service
    container_name: auth_kafka_consumer
    volumes:
      - ./auth_service:/app
      - ./common:/app/common
    command: python consumer.py
    env_file:
      - ./auth_service/.env
    depends_on:
      auth_db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend
      - signoz-net
    restart: unless-stopped

  bloom_filter_kafka_consumer:
    build:
      context: ./bloom_filter_service
    container_name: bloom_filter_kafka_consumer
    volumes:
      - ./bloom_filter_service:/app
      - ./common:/app/common
    command: python consumer.py
    env_file:
      - ./bloom_filter_service/.env
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend
      - signoz-net
    restart: unless-stopped

  interview_kafka_consumer:
    build:
      context: ./interview_service
    container_name: interview_kafka_consumer
    volumes:
      - ./interview_service:/app
      - ./common:/app/common
    command: python consumer.py
    env_file:
      - ./interview_service/.env
    depends_on:
      interview_db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - backend
      - signoz-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  auth_db:
    image: postgres:15
    container_name: auth_db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${AUTH_USER}
      POSTGRES_PASSWORD: ${AUTH_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - auth_data:/var/lib/postgresql/data
    ports:
      - "${AUTH_EXTERNAL_PORT}:${AUTH_PORT}"
    networks:
      - backend

  interview_db:
    image: postgres:15
    container_name: interview_db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${INTERVIEW_USER}
      POSTGRES_PASSWORD: ${INTERVIEW_PASSWORD}
      POSTGRES_DB: ${INTERVIEW_DB_NAME}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${INTERVIEW_USER} -d ${INTERVIEW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - interview_data:/var/lib/postgresql/data
    ports:
      - "${INTERVIEW_EXTERNAL_PORT}:${INTERVIEW_PORT}"
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth_service
      - interview_service
      - bloom_filter_service
    networks:
      - backend

networks:
  backend:
    driver: bridge
  signoz-net:
    external: true

volumes:
  auth_data:
  interview_data:
  celery_beat_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  minio_data:


